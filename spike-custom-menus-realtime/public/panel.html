<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel de Alertas (spike)</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f1115; color: #e8e8e8; margin: 0; padding: 16px; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  #status { font-size: 12px; color: #8a8f98; margin-bottom: 16px; }
  .alert { background: #1b1f27; border-left: 4px solid #5b8cff; border-radius: 6px; padding: 10px 12px; margin-bottom: 8px; animation: pop 0.25s ease-out; }
  .alert .type { font-weight: 600; font-size: 13px; }
  .alert .meta { font-size: 11px; color: #8a8f98; margin-top: 2px; }
  .alert .summary { font-size: 13px; margin-top: 4px; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
  #empty { color: #5a5f68; font-size: 13px; }
</style>
</head>
<body>
  <h1>Panel de Alertas — spike de Custom Menus</h1>
  <div id="status">conectando…</div>
  <div id="list"></div>
  <div id="empty">Sin alertas todavía. Dispara una con /simulate o un webhook real.</div>

  <script>
    const list = document.getElementById('list');
    const empty = document.getElementById('empty');
    const status = document.getElementById('status');

    const source = new EventSource('/events/stream');

    source.onopen = () => { status.textContent = 'conectado (SSE activo)'; };
    source.onerror = () => { status.textContent = 'desconectado, reintentando…'; };

    source.onmessage = (e) => {
      const alert = JSON.parse(e.data);
      empty.style.display = 'none';

      const el = document.createElement('div');
      el.className = 'alert';
      el.innerHTML =
        '<div class="type">' + alert.type + '</div>' +
        '<div class="meta">' + alert.locationId + ' · ' + new Date(alert.receivedAt).toLocaleTimeString() + '</div>' +
        '<div class="summary">' + alert.summary + '</div>';
      list.prepend(el);
    };
  </script>
</body>
</html>
